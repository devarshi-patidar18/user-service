# ==============================
# Application Basic Info
# ==============================
spring.application.name=user-service

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/agrosense_users
spring.datasource.username=root
spring.datasource.password=Dp@1812@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# ==============================
# JWT Authentication Config
# ==============================
jwt.secret=!@#!@JL@JL#KJHKHKH#K$@H#L$@L#J$L@J#L$J@L#J$
jwt.expiration=86400000

# ==============================
# Eureka Client Config
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=DEBUG
logging.level.com.agrosense.userservice=DEBUG


# prefer IP address so Eureka registers reachable address instead of machine hostname
eureka.instance.prefer-ip-address=true

# force the IP to loopback for local dev
eureka.instance.ip-address=127.0.0.1

# optional: also set hostname to localhost
eureka.instance.hostname=localhost